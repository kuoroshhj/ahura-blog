<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Ahura Blog — Decap CMS Admin</title>
<meta name="robots" content="noindex, nofollow" />
<script src="https://unpkg.com/decap-cms@^3.3.0/dist/decap-cms.js"></script>
</head>
<body>
<script>
  // Initialize Decap CMS with config from config.yml
  if (window.CMS) {
    CMS.init({
      config: {
        backend: {
          name: 'git-gateway',
          branch: 'main',
          repo: 'kuoroshhj/ahura-blog'
        }
      }
    });
  }
</script>
</body>
</html>
